area:api:
  - changed-files:
      - any-glob-to-any-file:
          - api/**

area:web:
  - changed-files:
      - any-glob-to-any-file:
          - web/**

area:redis:
  - changed-files:
      - any-glob-to-any-file:
          - docker-compose.yml
          - api/src/**/*redis*
          - api/src/**/*idempotency*
          - api/src/**/*velocity*

area:infra:
  - changed-files:
      - any-glob-to-any-file:
          - infra/**
          - "**/Dockerfile"
          - docker-compose.yml
          - .github/workflows/deploy.yml
          - .github/workflows/load-test.yml

area:quality:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .githooks/**
          - .pre-commit-config.yaml
          - .gitleaks.toml
          - scripts/governance/**
          - sonar-project.properties

area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - CONTRIBUTING.md
          - SECURITY.md
          - docs/**
